[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The URL is injected from app.config at runtime (alembic/env.py); this value
# is a placeholder so the CLI does not complain when it parses the file.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Readable, sortable migration filenames: 2026_08_21_1430-ab12cd_add_users.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# No post_write_hooks: the console_scripts entrypoint lookup is fragile across
# environments (it fails outright if ruff is installed without that metadata,
# which aborts revision generation). Migrations are formatted by the normal
# `ruff format` pass and checked in CI like every other file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
